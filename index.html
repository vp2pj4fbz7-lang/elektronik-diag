<!doctype html><html lang='pl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0e1319'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-title' content='Elektronik Diag'><link rel='apple-touch-icon' href='icons/icon-192.png'><link rel='manifest' href='manifest.webmanifest'><title>Elektronik Diag</title><style>
body{margin:0;background:#0b1015;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{background:#11161c;padding:16px}main{padding:20px}button,input,textarea{font:inherit}.nav button{display:block;width:100%;padding:12px;margin:4px 0;background:#202934;color:#fff;border:0;border-radius:10px;text-align:left}.view{display:none}.view.active{display:block}.card,.item{background:#151b22;border:1px solid #2d3844;border-radius:14px;padding:14px;margin:10px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2d3844;background:#0f1419;color:#fff}.badge{color:#aab5c0;font-size:12px}@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:5}.nav{display:flex;overflow:auto}.nav button{min-width:max-content;margin-right:6px}}
</style></head><body><div class='app'><aside><h2>Elektronik Diag</h2><div class='nav'><button onclick="show('home')">Pulpit</button><button onclick="show('faults')">Usterki</button><button onclick="show('training')">Szkolenia</button><button onclick="show('notes')">Moje naprawy</button></div></aside><main>
<section id='home' class='view active'><h1>Elektronik Diag</h1><div class='card'>Baza wiedzy do diagnozy elektroniki użytkowej.</div></section>
<section id='faults' class='view'><h1>Biblioteka usterek</h1><input id='fs' placeholder='Szukaj...'><div id='fl'></div><div id='fd'></div></section>
<section id='training' class='view'><h1>Szkolenia</h1><div id='tl'></div><div id='td'></div></section>
<section id='notes' class='view'><h1>Moje naprawy</h1><input id='dev' placeholder='Urządzenie'><br><br><input id='sym' placeholder='Objaw'><br><br><textarea id='mea' placeholder='Pomiary'></textarea><br><br><textarea id='fix' placeholder='Naprawa'></textarea><br><br><button onclick='saveNote()'>Zapisz</button><div id='nl'></div></section>
</main></div><script>
const faults=[["Laptop — brak zasilania", "Laptop", ["Sprawdź napięcie zasilacza na wejściu płyty.", "Sprawdź bezpiecznik i MOSFET-y wejściowe.", "Sprawdź 3,3 V i 5 V standby.", "Jeśli standby jest, sprawdź POWER i EN kolejnych przetwornic."]], ["Telewizor — dźwięk jest, brak obrazu", "Telewizor", ["Wykonaj test latarką.", "Sprawdź BL_ON.", "Sprawdź driver LED.", "Jeśli podświetlenie działa, sprawdź T-CON/panel."]], ["Konsola — brak obrazu HDMI", "Konsola", ["Potwierdź pełny start.", "Sprawdź port HDMI i ESD.", "Sprawdź zasilania retimera/encodera.", "Sprawdź zegary i sygnały sterujące."]], ["Buck — VIN jest, VOUT = 0 V", "Zasilanie PCB", ["Zmierz VIN.", "Zmierz EN.", "Sprawdź rezystancję VOUT do GND.", "Sprawdź SW na cewce i FB."]], ["Zwarcie na szynie", "PCB", ["Zidentyfikuj nazwę i napięcie szyny.", "Zmierz rezystancję do GND.", "Odseparuj gałąź cewką lub 0 Ω, jeśli to możliwe.", "Nie wstrzykuj napięcia bez ustalenia bezpiecznego poziomu."]], ["AGD — moduł martwy", "AGD", ["Sprawdź ślady przepięcia/wilgoci.", "Sprawdź bezpieczniki.", "Sprawdź blok AC/DC.", "Zmierz 5 V / 3,3 V."]]], training=[["Bezpieczna diagnostyka", "Podstawy", ["Najpierw oględziny i pomiary bez zasilania.", "Po stronie pierwotnej SMPS są niebezpieczne napięcia.", "Nie mostkuj bezpieczników.", "Nie wstrzykuj napięcia w nieznaną szynę."]], ["Sekwencja startu", "Diagnostyka", ["VIN → STBY → POWER → EN/PS_ON → 3V3 → 1V8 → VCORE → RESET/CLOCK.", "Najważniejszy jest pierwszy nieprawidłowy punkt."]], ["Przetwornica buck", "Zasilanie", ["VIN", "EN", "SW/cewka", "VOUT", "FB"]], ["Tor HDMI", "Sygnały", ["Port → ESD → retimer/encoder → odbiornik/SoC.", "Najpierw potwierdź pełny start urządzenia."]]];
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function rf(){let q=document.getElementById('fs').value.toLowerCase();let a=faults.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('fl').innerHTML=a.map(x=>`<div class="item" onclick="sf('${encodeURIComponent(x[0])}')"><b>${x[0]}</b><div class="badge">${x[1]}</div></div>`).join('')}
function sf(t){let x=faults.find(y=>y[0]===decodeURIComponent(t));document.getElementById('fd').innerHTML=`<div class="card"><h2>${x[0]}</h2>${x[2].map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}</div>`}
document.getElementById('fs').oninput=rf;rf();
document.getElementById('tl').innerHTML=training.map(x=>`<div class="item" onclick="st('${encodeURIComponent(x[0])}')"><b>${x[0]}</b><div class="badge">${x[1]}</div></div>`).join('');
function st(t){let x=training.find(y=>y[0]===decodeURIComponent(t));document.getElementById('td').innerHTML=`<div class="card"><h2>${x[0]}</h2>${x[2].map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}</div>`}
let notes=JSON.parse(localStorage.getItem('ednotes')||'[]');function rn(){document.getElementById('nl').innerHTML=notes.map(n=>`<div class="item"><b>${n.dev} — ${n.sym}</b><p>${n.mea}</p><p>${n.fix}</p></div>`).join('')}function saveNote(){let n={dev:dev.value,sym:sym.value,mea:mea.value,fix:fix.value};notes.push(n);localStorage.setItem('ednotes',JSON.stringify(notes));rn()}rn();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
