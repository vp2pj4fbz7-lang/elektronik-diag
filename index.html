<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Elektronik Diag v2</title><style>body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#111827;padding:18px}main{padding:22px}button{font:inherit}.nav button{display:block;width:100%;padding:12px;margin:4px 0;border:0;border-radius:10px;background:#334155;color:white;text-align:left}.view{display:none}.view.active{display:block}.card,.item{background:#151d31;border:1px solid #475569;border-radius:14px;padding:16px;margin:12px 0}input{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:white}.flow{display:flex;align-items:center;gap:7px;overflow:auto}.node{padding:12px;background:#334155;border-radius:10px;min-width:100px;text-align:center;cursor:pointer}.arrow{font-size:22px}@media(max-width:700px){.app{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}}</style></head><body><div class="app"><aside><h2>Elektronik Diag</h2><div class="nav"><button onclick="show('home')">Pulpit</button><button onclick="show('faults')">Baza usterek</button><button onclick="show('schemes')">Schematy</button></div></aside><main><section id="home" class="view active"><h1>Elektronik Diag v2</h1><div class="card">Nowa wersja z bazą usterek i interaktywnymi schematami diagnostycznymi.</div></section><section id="faults" class="view"><h1>Baza usterek</h1><input id="q" placeholder="Szukaj..." oninput="renderFaults()"><div id="faultList"></div></section><section id="schemes" class="view"><h1>Schematy</h1><div id="schemeList"></div></section></main></div><script>const faults=[{"cat": "Laptop", "title": "Brak reakcji na POWER", "steps": ["Sprawdź napięcie wejściowe i bezpiecznik", "Sprawdź MOSFET-y wejściowe", "Sprawdź 3.3V/5V standby", "Sprawdź POWER_BTN i EC/KBC"], "suspects": "wejście DC, MOSFET, charger, standby, EC/KBC"}, {"cat": "TV", "title": "Jest dźwięk, brak obrazu", "steps": ["Test latarką", "Sprawdź BL_ON", "Sprawdź driver LED", "Sprawdź T-CON i napięcia panelu"], "suspects": "LED, driver LED, T-CON, panel"}, {"cat": "Konsola", "title": "Brak obrazu HDMI", "steps": ["Potwierdź pełny start", "Sprawdź port i ESD", "Sprawdź zasilania retimera/encodera", "Sprawdź zegary i sygnały"], "suspects": "port HDMI, ESD, retimer, encoder"}, {"cat": "Zasilacz", "title": "Brak napięcia wyjściowego", "steps": ["Sprawdź bezpiecznik i zwarcia", "Sprawdź VCC kontrolera PWM", "Sprawdź MOSFET kluczujący", "Sprawdź wtórną i feedback"], "suspects": "PWM, MOSFET, opto, TL431"}, {"cat": "PCB", "title": "Zwarcie na szynie", "steps": ["Zidentyfikuj napięcie nominalne", "Zmierz rezystancję do GND", "Odseparuj gałąź cewką/0Ω", "Wstrzykuj tylko z limitem prądu i bezpiecznym napięciem"], "suspects": "MLCC, MOSFET, IC, TVS"}];const schemes=[{"title": "Sekwencja startu", "blocks": [["VIN", "Sprawdź wejście i zabezpieczenia"], ["STBY", "Sprawdź standby"], ["POWER", "Sprawdź POWER"], ["EN", "Sprawdź EN"], ["3V3", "Sprawdź 3.3V"], ["1V8", "Sprawdź 1.8V"], ["VCORE", "Sprawdź VCORE"], ["RESET/CLOCK", "Sprawdź reset i zegary"]]}, {"title": "BUCK", "blocks": [["VIN", "Napięcie wejściowe"], ["EN", "Sygnał enable"], ["SW", "Węzeł przełączający"], ["CEWKA", "Cewka i zwarcie"], ["VOUT", "Napięcie wyjściowe"], ["FB", "Sprzężenie zwrotne"]]}];function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active')}function renderFaults(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('faultList').innerHTML=faults.filter(f=>JSON.stringify(f).toLowerCase().includes(q)).map(f=>`<div class="item"><b>${f.cat} — ${f.title}</b><ol>${f.steps.map(s=>`<li>${s}</li>`).join('')}</ol><small>Podejrzane: ${f.suspects}</small></div>`).join('')}renderFaults();document.getElementById('schemeList').innerHTML=schemes.map((s,si)=>`<div class="card"><h2>${s.title}</h2><div class="flow">${s.blocks.map((b,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node" onclick="document.getElementById('d${si}').textContent=${JSON.stringify(b[1])}">${b[0]}</span>`).join('')}</div><p id="d${si}">Kliknij blok.</p></div>`).join('');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
