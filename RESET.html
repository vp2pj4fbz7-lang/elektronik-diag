<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Elektronik Diag – RESET</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1624;color:#fff;padding:24px}
.box{max-width:680px;margin:auto;background:#132b45;padding:24px;border-radius:18px}
button{font-size:18px;padding:14px 18px;border-radius:12px;border:0}
#log{white-space:pre-wrap;margin-top:18px;color:#cfe8ff}
</style></head><body><div class="box">
<h1>Elektronik Diag – twardy reset</h1>
<p>Ta strona usuwa stare cache i wyrejestrowuje Service Workery dla tej aplikacji.</p>
<button id="go">Wyczyść i uruchom V6.7.2</button>
<div id="log"></div>
</div>
<script>
document.getElementById('go').onclick=async()=>{
 const log=document.getElementById('log');
 try{
   log.textContent='1/3 Usuwanie cache...\n';
   if('caches' in window){
     const ks=await caches.keys();
     for(const k of ks){ await caches.delete(k); log.textContent+='Usunięto: '+k+'\n'; }
   }
   log.textContent+='2/3 Wyrejestrowanie Service Workerów...\n';
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     for(const r of regs){ await r.unregister(); log.textContent+='Wyrejestrowano SW\n'; }
   }
   log.textContent+='3/3 Uruchamianie nowej wersji...\n';
   setTimeout(()=>location.replace('./index.html?v=6.7.2&reset='+Date.now()),800);
 }catch(e){
   log.textContent+='Błąd: '+e+'\nSpróbuj otworzyć index.html?v=6.7.2 bezpośrednio w Safari.';
 }
};
</script></body></html>
