<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Elektronik Diag – RESET V6.7.3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1624;color:#fff;padding:24px}
.box{max-width:680px;margin:auto;background:#132b45;padding:24px;border-radius:18px}
button{font-size:18px;padding:14px 18px;border-radius:12px;border:0}
#log{white-space:pre-wrap;margin-top:18px;color:#cfe8ff}
</style></head><body><div class="box">
<h1>Elektronik Diag – reset V6.7.3</h1>
<p>Usuwa stare cache i stare Service Workery, a następnie uruchamia poprawioną wersję.</p>
<button id="go">Wyczyść i uruchom V6.7.3</button>
<div id="log"></div>
</div>
<script>
document.getElementById('go').onclick=async()=>{
 const log=document.getElementById('log');
 try{
  log.textContent='Usuwanie cache...\n';
  if('caches' in window){for(const k of await caches.keys()){await caches.delete(k);log.textContent+='Usunięto '+k+'\n';}}
  if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations()){await r.unregister();}}
  log.textContent+='Uruchamianie V6.7.3...';
  setTimeout(()=>location.replace('./index.html?v=6.7.3&t='+Date.now()),500);
 }catch(e){log.textContent+='Błąd: '+e;}
};
</script></body></html>
